baseURL: https://vramlab.com/
locale: en-us
title: VRAM Lab
theme: PaperMod
timeZone: Asia/Seoul

enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # required for PaperMod search page

# Keep tag/category navigation crawlable, but promote the curated topic pages
# instead of thin generated archives in search results and the XML sitemap.
cascade:
  - target:
      kind: taxonomy
    params:
      robotsNoIndex: true
    sitemap:
      disable: true
  - target:
      kind: term
    params:
      robotsNoIndex: true
    sitemap:
      disable: true

params:
  env: production
  description: "Tested fixes and reproducible benchmarks for local AI on Windows, WSL2, and consumer GPUs. Exact versions, commands, measurements, and logs."
  keywords: [local ai, local llm, vram, benchmark, cuda, wsl2, low vram]
  mainSections: [posts]
  author: Sinhyeok Lee
  images: ["/images/og-local-ai.png"] # 사이트 기본 og:image (글별 images 파라미터가 우선)
  cloudflareAnalyticsToken: "99f4e9ccd1b6474480e67720156ca0da" # Cloudflare Web Analytics (쿠키리스, production 빌드에만 삽입)

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  ShowFullTextinRSS: false

  homeInfoParams:
    Title: "Local AI, tested on consumer hardware"
    Content: |
      Windows and WSL2 fixes, CUDA compatibility checks, and 8 GB inference experiments.
      Each report includes the tested versions, commands, results, and a session log.

      [Start with your problem](/start-here/) · [Browse all reports](/posts/)

  socialIcons:
    - name: github
      url: "https://github.com/ljk5998"
    - name: rss
      url: "/index.xml"

  fuseOpts: # search tuning
    isCaseSensitive: false
    shouldSort: true
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]

menu:
  main:
    - identifier: start-here
      name: Start here
      url: /start-here/
      weight: 10
    - identifier: fixes
      name: Fixes
      url: /fixes/
      weight: 20
    - identifier: compatibility
      name: Compatibility
      url: /compatibility/
      weight: 30
    - identifier: benchmarks
      name: Benchmarks
      url: /benchmarks/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML in markdown (benchmark tables, shortcode output)
  highlight:
    codeFences: true
    guessSyntax: false
    noClasses: false
    style: monokai

privacy:
  vimeo:
    disabled: true
  x:
    disabled: true
  instagram:
    disabled: true
  youtube:
    privacyEnhanced: true
